[package]
name = "mpvkit"
version = "0.1.6"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
sevenz-rust2 = { version = "=0.24.1", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell_Common",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug UI repeatedly verifies fixed MPV assets; keep integrity checks responsive.
[profile.dev.package.sha2]
opt-level = 3
