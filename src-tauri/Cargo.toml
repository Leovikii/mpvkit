[package]
name = "mpvkit"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
semver = { version = "1", features = ["serde"] }
sha2 = "=0.10.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls"] }
[target.'cfg(target_os = "linux")'.dependencies]
tempfile = "=3.27.0" # Private, automatically cleaned package-update staging.
libc = "=0.2.191" # Bounded reads from child pipes on Unix.
gtk = "=0.18.2" # Native desktop preferences and portal settings.
gdkwayland-sys = "=0.18.2" # Borrow the GTK window's existing Wayland display and surface.
wayland-client = { version = "=0.31.15", features = ["system"] } # Safe protocol bindings on the borrowed GDK connection.
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] } # Standard background blur with compositor capability feedback.

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Power",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Debug UI repeatedly verifies fixed MPV assets; keep integrity checks responsive.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tempfile = "=3.27.0" # Compile the shared Linux transaction tests on Windows too.
tauri = { version = "=2.12.4", features = ["test"] } # Official mock runtime for download-only updater verification.
