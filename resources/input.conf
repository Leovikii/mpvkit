# Generated by MpvKit. Keyboard shortcuts are intentionally minimal.
SPACE cycle pause
ENTER cycle fullscreen
LEFT seek -5 relative+exact
RIGHT seek 5 relative+exact
UP add volume 10
DOWN add volume -10
i script-binding stats/display-stats
I script-binding stats/display-stats-toggle
` script-binding commands/open
# Ignore clicks on the video background; uosc buttons keep their own bindings.
MBTN_LEFT ignore
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT script-binding uosc/menu
