name: Checks
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - run: node --test scripts/ci-changes.test.mjs
      - id: changes
        run: node scripts/ci-changes.mjs
  frontend:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:frontend && node --test scripts/release.test.mjs && pnpm build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend
          path: dist
          retention-days: 1
  rust:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-24.04
            container: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    steps:
      - if: runner.os == 'Linux'
        run: pacman -Syu --noconfirm --needed base-devel git rustup webkit2gtk-4.1 gtk3 xdg-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend
          path: dist
      - shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: echo "ARCH_ABI=$(pacman -Q | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: check-${{ runner.os }}-1.98.1-${{ env.ARCH_ABI }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: check-${{ runner.os }}-1.98.1-${{ env.ARCH_ABI }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then cargo fmt --manifest-path src-tauri/Cargo.toml --check; fi
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
  required:
    name: CI
    if: always()
    needs: [changes, frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks or a documentation-only change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD: ${{ needs.changes.outputs.build }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$BUILD" in
            true) test "$FRONTEND_RESULT" = success && test "$RUST_RESULT" = success ;;
            false) test "$FRONTEND_RESULT" = skipped && test "$RUST_RESULT" = skipped ;;
            *) exit 1 ;;
          esac
