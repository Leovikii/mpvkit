name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing trusted version tag (v0.2.0-alpha.1)
        required: true
      operation:
        type: choice
        options: [release, publish]
        default: release
      build_run:
        description: Optional run ID containing publish-assets for a publish retry
        required: false
      arch_package:
        description: Select only after the recipe is available on AUR
        type: choice
        options: [none, mpvkit-bin, mpvkit-preview-bin]
        default: none
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name == 'push' && github.sha || inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .local/workflow
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_OPERATION: ${{ inputs.operation }}
        run: node .local/workflow/scripts/prepare-release.mjs
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    environment: release-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: ubuntu-24.04
            container: archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - if: runner.os == 'Linux'
        run: pacman -Syu --noconfirm --needed base-devel git rustup nodejs npm webkit2gtk-4.1 gtk3 xdg-utils mpv zstd desktop-file-utils namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.25.0
      - shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - if: runner.os == 'Linux'
        run: |
          pacman -Q > arch-system.txt
          echo "ARCH_ABI=$(sha256sum arch-system.txt | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: release-${{ runner.os }}-1.98.1-${{ env.ARCH_ABI }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ needs.prepare.outputs.tag }}
          restore-keys: release-${{ runner.os }}-1.98.1-${{ env.ARCH_ABI }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/AppData/Local/pnpm/store
          key: pnpm-release-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - shell: bash
        run: |
          pnpm test:frontend
          node --test scripts/release.test.mjs
          pnpm build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Windows NSIS and updater signature
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MPVKIT_UPDATER_PUBLIC_KEY: ${{ vars.MPVKIT_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build-windows.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .local/release | Out-Null
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/MpvKit_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $installer, "$installer.sig" -Destination .local/release/
      - name: Arch native binary, archive and makepkg
        if: runner.os == 'Linux'
        run: |
          pnpm tauri build --no-bundle --config '{"build":{"beforeBuildCommand":""}}'
          useradd -m builder
          mkdir -p .local/release
          chown -R builder:builder .local
          runuser -u builder -- node scripts/release.mjs arch .local/release
          cp arch-system.txt .local/release/
          desktop-file-validate packaging/io.github.mpvkit.desktop
          readelf -d src-tauri/target/release/mpvkit > .local/release/elf-dependencies.txt
          namcap .local/release/*.pkg.tar.zst > .local/release/namcap.txt
          test "$(vercmp 0.2.0alpha1 0.2.0beta1)" = -1
          test "$(vercmp 0.2.0rc1 0.2.0)" = -1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ runner.os }}
          path: |
            .local/release/*.*
            .local/release/aur/PKGBUILD
            .local/release/aur/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  package:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: .local/release
          merge-multiple: true
      - run: |
          tar -czf .local/release/aur-recipe.tar.gz -C .local/release/aur PKGBUILD .SRCINFO
          node scripts/release.mjs manifest .local/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-assets
          path: |
            .local/release/*.*
            .local/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, package]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.package.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'publish'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      # Use the workflow revision for publication fixes without moving an existing version tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .local/workflow
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - name: Check source version and license materials
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release.mjs check "$RELEASE_TAG"
          node .local/workflow/scripts/verify-release.mjs gate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.package.result == 'success'
        with:
          name: publish-assets
          path: .local/release
      - name: Reuse completed build artifacts
        if: needs.package.result == 'skipped' && inputs.build_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: gh run download "$BUILD_RUN" --name publish-assets --dir .local/release
      - name: Reuse existing release assets
        if: needs.package.result == 'skipped' && inputs.build_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir .local/release
      - name: Verify and publish release and update channels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ARCH_PACKAGE: ${{ inputs.arch_package || 'none' }}
          PUBLIC_KEY: ${{ vars.MPVKIT_UPDATER_PUBLIC_KEY }}
        run: |
          cd .local/release
          sha256sum --check SHA256SUMS
          cd ../..
          sudo apt-get update -qq && sudo apt-get install -y minisign
          printf '%s' "$PUBLIC_KEY" | base64 --decode > .local/updater.pub
          for file in .local/release/*-setup.exe; do
            base64 --decode "$file.sig" > .local/installer.minisig
            minisign -Vm "$file" -x .local/installer.minisig -p .local/updater.pub
          done
          node scripts/verify-release.mjs .local/release
          node .local/workflow/scripts/publish-release.mjs
